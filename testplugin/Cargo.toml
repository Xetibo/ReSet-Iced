[package]
name = "test_plugin"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["dylib"]

[dependencies]
iced = { version = "0.13.1", features = [
	"advanced",
	"canvas",
	"image",
	"svg",
	"tokio",
] }
#oxiced = "0.2.0"
oxiced = { git = "https://github.com/Xetibo/oxiced", branch = "iced14" }
zbus = "5.3.1"
#re_set-lib = "5.2.5"
re_set-lib = { git = "https://github.com/Xetibo/ReSet-Lib", branch = "dashie-2" }
#reset_daemon = "2.2.0"
reset_daemon = { git = "https://github.com/Xetibo/ReSet-Daemon", branch = "dashie-2" }
tokio = { version = "1.43.0", features = ["full"] }
serde = "1.0.217"
tap = "1.0.1"
num-traits = "0.2.19"
enum_stringify = "0.6.1"
lyon_algorithms = "1.0.5"
libloading = "0.8.6"
