[package]
name = "reset"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "0.14.0-dev", features = [
	"advanced",
	"canvas",
	"image",
	"svg",
	"tokio",
], git = "https://github.com/iced-rs/iced" }
# oxiced = "0.2.0"
oxiced = { git = "https://github.com/Xetibo/oxiced", branch = "iced14" }
zbus = "5.9.0"
#re_set-lib = "5.2.5"
re_set-lib = { git = "https://github.com/Xetibo/ReSet-Lib", branch = "dashie-2" }
#reset_daemon = "2.2.0"
reset_daemon = { git = "https://github.com/Xetibo/ReSet-Daemon", branch = "dashie-2" }
tokio = { version = "1.47.1", features = ["full"] }
serde = "1.0.219"
tap = "1.0.1"
num-traits = "0.2.19"
enum_stringify = "0.6.4"
lyon_algorithms = "1.0.5"
libloading = "0.8.8"
once_cell = "1.21.3"
toml = "0.9.5"
macro-utils = "0.1.3"
